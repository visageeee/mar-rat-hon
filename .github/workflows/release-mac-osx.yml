name: Build Mar-rat-hon for macOS
# Registered for Mar-rat-hon Actions

on:
  workflow_dispatch:
  workflow_call:

jobs:
  release:
    name: macOS universal
    runs-on: macos-15

    steps:
      - name: Check out Mar-rat-hon
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build Mar-rat-hon
        uses: ./.github/actions/build-mac-osx
        with:
          xcode_targets: "Aleph One"

      - name: Package Mar-rat-hon app
        run: |
          test -d "Xcode/build/Release/Sprintathon.app"

          mkdir -p             "Xcode/build/Release/Sprintathon.app/Contents/Resources/snd"
          mkdir -p             "Xcode/build/Release/Sprintathon.app/Contents/Resources/DataFiles/Sprintathon"

          cp snd/*.ogg             "Xcode/build/Release/Sprintathon.app/Contents/Resources/snd/"
          cp gfx/leftpaw.png gfx/nose.png sfx/squeak.ogg \
            "Xcode/build/Release/Sprintathon.app/Contents/Resources/DataFiles/Sprintathon/"

          codesign --force --deep --sign - --timestamp=none \
            "Xcode/build/Release/Sprintathon.app"

          codesign --verify --deep --strict --verbose=2 \
            "Xcode/build/Release/Sprintathon.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "Xcode/build/Release/Sprintathon.app" \
            "Mar-rat-hon-macOS-universal.zip"

      - name: Upload Mar-rat-hon
        uses: actions/upload-artifact@v6
        with:
          name: Mar-rat-hon-macOS-universal
          if-no-files-found: error
          path: Mar-rat-hon-macOS-universal.zip
          retention-days: 14
