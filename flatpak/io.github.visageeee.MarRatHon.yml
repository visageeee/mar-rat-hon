app-id: io.github.visageeee.MarRatHon
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: mar-rat-hon

finish-args:
  - --device=dri
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --filesystem=/tmp

modules:
  - shared/boost.yml
  - shared/glu.yml
  - shared/sdl2-image.yml
  - shared/sdl2-ttf.yml
  - shared/zzip.yml
  - shared/miniupnpc.yml
  - shared/asio.yml
  - shared/ebml.yml
  - shared/matroska.yml
  - shared/libyuv.yml
  - shared/alephone.yml

  - name: mar-rat-hon-launcher
    buildsystem: simple
    build-commands:
      - mv /app/bin/sprintathon /app/bin/sprintathon-engine
      - cc -O2 sprintathon-game-selector.c -o mar-rat-hon-game-selector $(pkg-config --cflags --libs gtk+-3.0)
      - install -Dm755 mar-rat-hon-game-selector /app/bin/mar-rat-hon-game-selector
      - install -Dm755 mar-rat-hon.sh /app/bin/mar-rat-hon
      - install -Dm644 mar-rat-hon.desktop /app/share/applications/io.github.visageeee.MarRatHon.desktop
      - install -Dm644 marathon-infinity.png /app/share/icons/hicolor/512x512/apps/io.github.visageeee.MarRatHon.png
    sources:
      - type: file
        path: sprintathon-game-selector.c
      - type: file
        path: mar-rat-hon.sh
      - type: file
        path: mar-rat-hon.desktop
      - type: file
        path: marathon-infinity.png
